<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRG FAST DELIVERY - Cloud System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f0f4f8; }
        .navbar { background-color: #003366; border-bottom: 4px solid #00a8e8; }
        .promo-banner { background: linear-gradient(45deg, #003366, #00a8e8); color: white; border-radius: 15px; padding: 20px; margin-bottom: 25px; }
        .category-pill { cursor: pointer; transition: 0.3s; border: 2px solid #003366; color: #003366; font-weight: 600; background: white; white-space: nowrap; }
        .category-pill.active { background-color: #003366; color: white; }
        .menu-card { border: none; border-radius: 15px; transition: 0.3s; background: white; height: 100%; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .menu-img { height: 160px; width: 100%; object-fit: cover; background-color: #eee; }
        .seller-info { background-color: #e6f7ff; color: #003366; font-size: 0.7rem; padding: 4px; text-align: center; }
        .cart-box { background: white; border-radius: 15px; padding: 20px; position: sticky; top: 20px; border: 1px solid #d1e9ff; }
        .admin-section { display: none; background: #fff; padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 2px dashed #003366; }
        .btn-admin-toggle { opacity: 0.3; font-size: 10px; color: white; border: none; background: none; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .payment-info { background: #fff9db; border: 1px solid #fab005; border-radius: 8px; padding: 10px; margin-top: 10px; font-size: 0.85rem; display: none; }
        .rekap-table { font-size: 0.8rem; }
    </style>
</head>
<body>

<div id="loading" class="loading-overlay">
    <div class="spinner-border text-primary"></div>
    <span class="ms-2">Menyambungkan ke Database...</span>
</div>

<nav class="navbar navbar-dark shadow-sm mb-4">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand fw-bold" href="#">⚡ NRG FAST DELIVERY</a>
        <button class="btn-admin-toggle" onclick="toggleAdmin()">ADMIN</button>
    </div>
</nav>

<div class="container mb-5">
    <div class="promo-banner d-flex align-items-center justify-content-between">
        <div>
            <h4 class="fw-bold mb-1">Database Cloud Aktif 🌐</h4>
            <p class="mb-0 opacity-75">Sistem Pemesanan Real-Time NRG.</p>
        </div>
    </div>

    <div id="admin-panel" class="admin-section shadow-sm">
        <h5 class="fw-bold mb-3 text-center text-primary">🛠️ PANEL ADMIN CLOUD</h5>
        
        <ul class="nav nav-tabs mb-3" id="adminTab" role="tablist">
            <li class="nav-item">
                <button class="nav-link active btn-sm" data-bs-toggle="tab" data-bs-target="#tab-tambah">Tambah Menu</button>
            </li>
            <li class="nav-item">
                <button class="nav-link btn-sm" data-bs-toggle="tab" data-bs-target="#tab-rekap" onclick="renderRekap()">Rekap Pesanan</button>
            </li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="tab-tambah">
                <div class="row g-2 mb-3">
                    <div class="col-md-3"><input type="text" id="adm-name" class="form-control form-control-sm" placeholder="Nama Menu"></div>
                    <div class="col-md-2"><input type="number" id="adm-price" class="form-control form-control-sm" placeholder="Harga"></div>
                    <div class="col-md-2">
                        <select id="adm-cat" class="form-select form-select-sm">
                            <option value="Makanan">Makanan</option>
                            <option value="Minuman">Minuman</option>
                            <option value="Snack">Snack</option>
                            <option value="Sembako">Sembako</option>
                        </select>
                    </div>
                    <div class="col-md-3"><input type="text" id="adm-seller" class="form-control form-control-sm" placeholder="Toko"></div>
                    <div class="col-md-2"><button class="btn btn-success btn-sm w-100" onclick="saveToCloud()">SIMPAN</button></div>
                    <div class="col-12 mt-2"><input type="text" id="adm-img" class="form-control form-control-sm" placeholder="URL Gambar Langsung"></div>
                </div>
            </div>

            <div class="tab-pane fade" id="tab-rekap">
                <div class="table-responsive">
                    <table class="table table-bordered table-sm rekap-table">
                        <thead class="table-light">
                            <tr>
                                <th>Waktu</th>
                                <th>Pelanggan</th>
                                <th>Pesanan</th>
                                <th>Total</th>
                                <th>Bayar</th>
                            </tr>
                        </thead>
                        <tbody id="rekap-body">
                            <tr><td colspan="5" class="text-center">Memuat data rekap...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="row mb-4 align-items-center">
        <div class="col-md-8 d-flex gap-2 overflow-auto pb-2" id="filter-container"></div>
    </div>

    <div class="row">
        <div class="col-lg-8">
            <div class="row g-3" id="menu-container"></div>
        </div>

        <div class="col-lg-4">
            <div class="cart-box shadow-sm">
                <h6 class="fw-bold mb-3 border-bottom pb-2">📦 Keranjang</h6>
                <div id="cart-list" class="mb-3"></div>
                
                <div id="checkout-form" style="display: none;">
                    <label class="small fw-bold mb-1">Data Penerima:</label>
                    <input type="text" id="c-name" class="form-control form-control-sm mb-2" placeholder="Nama Anda">
                    <input type="number" id="c-wa" class="form-control form-control-sm mb-2" placeholder="No WhatsApp">
                    <textarea id="c-address" class="form-control form-control-sm mb-2" placeholder="Alamat Lengkap"></textarea>
                    
                    <label class="small fw-bold mb-1">Metode Pembayaran:</label>
                    <select id="c-payment" class="form-select form-select-sm mb-2" onchange="showPaymentInfo()">
                        <option value="COD">Tunai / COD</option>
                        <option value="BRI">Transfer BRI</option>
                        <option value="DANA">DANA</option>
                    </select>

                    <div id="payment-details" class="payment-info">
                        <div id="payment-text"></div>
                    </div>

                    <label class="small fw-bold mt-2 mb-1">Estimasi Waktu Kirim:</label>
                    <select id="c-delivery" class="form-select form-select-sm mb-2" onchange="toggleCustomTime()">
                        <option value="Segera (5-15 menit)">Segera (5-15 menit)</option>
                        <option value="Biasa (30-60 menit)">Biasa (30-60 menit)</option>
                        <option value="Lainnya">Lainnya : pada pukul...</option>
                    </select>
                    <input type="time" id="c-time" class="form-control form-control-sm mb-2" style="display: none;">
                </div>

                <div class="small border-top pt-2">
                    <div class="d-flex justify-content-between mb-1">
                        <span>Ongkir:</span>
                        <span id="c-shipping">Rp 5.000</span>
                    </div>
                    <div class="d-flex justify-content-between fw-bold mb-3 fs-5 text-primary">
                        <span>Total:</span>
                        <span id="c-total">Rp 0</span>
                    </div>
                </div>
                <button class="btn btn-primary w-100 py-2" onclick="processCheckout()">KIRIM PESANAN</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const config = {
        adminPhone: "6285281635766",
        pass: "25051987",
        shippingFee: 5000,
        // URL SCRIPT BARU ANDA
        scriptURL: 'https://script.google.com/macros/s/AKfycbxpfj3yEdCuwNVRd9SO2nMbd5qgFH-2RcIyRkY1mK-W5H7V3szSNQL3Rn60f7rjg6WW/exec'
    };

    let menuData = [];
    let orderHistory = [];
    let cart = [];
    let currentFilter = "Semua";
    const categories = ["Semua", "Makanan", "Minuman", "Snack", "Sembako"];

    async function init() {
        showLoading(true);
        renderFilters();
        try {
            const res = await fetch(config.scriptURL);
            const data = await res.json();
            // Data dari doGet di Apps Script diasumsikan mengirim objek {menu: [], orders: []}
            menuData = data.menu || [];
            orderHistory = data.orders || [];
            renderMenu();
        } catch (e) {
            alert("Gagal memuat data dari Cloud.");
        }
        showLoading(false);
    }

    function renderRekap() {
        const body = document.getElementById('rekap-body');
        if (orderHistory.length <= 1) {
            body.innerHTML = '<tr><td colspan="5" class="text-center">Belum ada pesanan masuk.</td></tr>';
            return;
        }
        // Slice(1) untuk melewati header sheet
        const rows = orderHistory.slice(1).reverse(); 
        body.innerHTML = rows.map(row => `
            <tr>
                <td>${new Date(row[0]).toLocaleTimeString('id-ID')}</td>
                <td><b>${row[1]}</b><br><small>${row[2]}</small></td>
                <td>${row[3]}</td>
                <td>Rp ${parseInt(row[4]).toLocaleString()}</td>
                <td>${row[5]}</td>
            </tr>
        `).join('');
    }

    async function processCheckout() {
        const name = document.getElementById('c-name').value;
        let waRaw = document.getElementById('c-wa').value;
        const addr = document.getElementById('c-address').value;
        const payMethod = document.getElementById('c-payment').value;
        const delivery = document.getElementById('c-delivery').value;
        const customTime = document.getElementById('c-time').value;

        if(!name || !waRaw || !addr) return alert("Mohon lengkapi data penerima!");

        let wa = waRaw.replace(/\D/g, '');
        if (wa.startsWith("0")) wa = "62" + wa.substring(1);
        
        const subtotal = cart.reduce((s, x) => s + (x.price * x.qty), 0);
        const total = subtotal + config.shippingFee;
        const listBarang = cart.map(x => `${x.name} (${x.qty})`).join(', ');

        showLoading(true);
        
        // 1. SIMPAN REKAP KE GOOGLE SHEETS
        try {
            const payload = { 
                action: "saveOrder", 
                name: name, 
                wa: wa, 
                items: listBarang, 
                total: total, 
                payment: payMethod 
            };
            
            await fetch(config.scriptURL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify(payload) 
            });
            
            // 2. KIRIM WHATSAPP (Sama seperti sebelumnya)
            let txtAdmin = `*PESANAN BARU NRG*\n👤 *Nama:* ${name}\n📍 *Alamat:* ${addr}\n📱 *WA:* ${wa}\n💳 *Bayar:* ${payMethod}\n--------------------------\n*Belanja:* ${listBarang}\n\n*TOTAL: Rp ${total.toLocaleString()}*`;
            
            alert("Pesanan tersimpan di sistem & akan diteruskan ke WhatsApp.");
            window.open(`https://wa.me/${config.adminPhone}?text=${encodeURIComponent(txtAdmin)}`, '_blank');
            location.reload();

        } catch (e) {
            alert("Terjadi kesalahan saat menyimpan ke Cloud.");
        }
        showLoading(false);
    }

    // --- FUNGSI PENDUKUNG (TIDAK BERUBAH) ---
    function toggleCustomTime() {
        const deliverySelect = document.getElementById('c-delivery').value;
        document.getElementById('c-time').style.display = (deliverySelect === "Lainnya") ? "block" : "none";
    }

    function showPaymentInfo() {
        const payMethod = document.getElementById('c-payment').value;
        const infoBox = document.getElementById('payment-details');
        const infoText = document.getElementById('payment-text');
        infoBox.style.display = (payMethod === "COD") ? "none" : "block";
        if (payMethod === "BRI") infoText.innerHTML = "<strong>BRI:</strong> 424901016402531<br>a.n Asep Saripudin";
        if (payMethod === "DANA") infoText.innerHTML = "<strong>DANA:</strong> 085281635766<br>a.n Asep Saripudin";
    }

    function renderFilters() {
        document.getElementById('filter-container').innerHTML = categories.map(cat => `
            <div class="badge rounded-pill category-pill px-4 py-2 ${currentFilter === cat ? 'active' : ''}" onclick="filterMenu('${cat}', this)">${cat}</div>
        `).join('');
    }

    function renderMenu() {
        const container = document.getElementById('menu-container');
        const filtered = currentFilter === "Semua" ? menuData : menuData.filter(m => m.cat === currentFilter);
        container.innerHTML = filtered.map(item => `
            <div class="col-6 col-md-4">
                <div class="card menu-card">
                    <img src="${item.img || 'https://via.placeholder.com/150'}" class="menu-img">
                    <div class="seller-info">Toko: ${item.seller}</div>
                    <div class="p-2 text-center">
                        <h6 class="fw-bold small mb-1">${item.name}</h6>
                        <p class="text-primary fw-bold small mb-2">Rp ${parseInt(item.price).toLocaleString()}</p>
                        <button class="btn btn-sm btn-outline-primary w-100" onclick="addToCart(${item.id})">Tambah</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    async function saveToCloud() {
        const name = document.getElementById('adm-name').value;
        const price = document.getElementById('adm-price').value;
        const cat = document.getElementById('adm-cat').value;
        const seller = document.getElementById('adm-seller').value;
        const img = document.getElementById('adm-img').value;
        if(!name || !price) return alert("Lengkapi data!");
        showLoading(true);
        await fetch(config.scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "saveMenu", name, price, cat, seller, img }) });
        alert("Menu Baru Tersimpan!");
        location.reload();
    }

    function addToCart(id) {
        const item = menuData.find(x => x.id == id);
        const cartItem = cart.find(x => x.id == id);
        if (cartItem) { cartItem.qty += 1; } else { cart.push({ ...item, qty: 1 }); }
        updateCart();
    }

    function updateCart() {
        const list = document.getElementById('cart-list');
        const totalDisp = document.getElementById('c-total');
        if (cart.length === 0) {
            list.innerHTML = '<p class="text-muted text-center small">Kosong</p>';
            totalDisp.innerText = 'Rp 0';
            document.getElementById('checkout-form').style.display = 'none';
            return;
        }
        document.getElementById('checkout-form').style.display = 'block';
        list.innerHTML = cart.map((item) => `
            <div class="d-flex justify-content-between small mb-1 border-bottom">
                <span>${item.name} x${item.qty}</span>
                <span>Rp ${(item.price * item.qty).toLocaleString()}</span>
            </div>
        `).join('');
        const subtotal = cart.reduce((s, x) => s + (x.price * x.qty), 0);
        totalDisp.innerText = `Rp ${(subtotal + config.shippingFee).toLocaleString()}`;
    }

    function filterMenu(cat, el) {
        currentFilter = cat;
        renderFilters();
        renderMenu();
    }

    function toggleAdmin() {
        if (prompt("Password Admin NRG:") === config.pass) {
            document.getElementById('admin-panel').style.display = 'block';
        }
    }

    function showLoading(show) {
        document.getElementById('loading').style.display = show ? 'flex' : 'none';
    }

    init();
</script>
</body>
</html>
